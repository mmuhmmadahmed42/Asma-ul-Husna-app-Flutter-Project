name: asma_ul_husna
description: "A beautiful and spiritual application to explore, listen, and learn the 99 Names of Allah (Asma-ul-Husna) with Urdu meanings and synchronized audio playback."
publish_to: 'none'

version: 1.0.0+1

environment:
  sdk: ^3.12.2

dependencies:
  flutter:
    sdk: flutter
  cupertino_icons: ^1.0.8
  provider: ^6.1.5+1
  just_audio: ^0.10.6
  just_audio_background: ^0.0.1-beta.17
  google_fonts: ^8.2.1

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0

flutter:
  uses-material-design: true
  assets:
    - assets/images/
    - assets/audio/
    - assets/json/
